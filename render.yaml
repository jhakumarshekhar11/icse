# Render Blueprint for a static site. Connect the GitHub repo in Render and it picks this up.
services:
  - type: web
    name: icseresources
    runtime: static
    branch: website
    buildCommand: node scripts/write-firebase-config.js && node scripts/build-seo.js
    staticPublishPath: .
    routes:
      # The library lives at the site root. Old /resource links still work.
      - type: redirect
        source: /resource
        destination: /
      - type: redirect
        source: /resource/*
        destination: /*
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /privpol
        destination: /privpol/index.html
      - type: rewrite
        source: /tos
        destination: /tos/index.html
      - type: rewrite
        source: /auth/action
        destination: /auth/action/index.html
      # /admin serves the admin console
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/
        destination: /admin/index.html
    headers:
      # Security headers for every page.
      # Strict-Transport-Security: browsers talk to this site over HTTPS only for the next year
      # (Render already redirects http to https; this header makes the browser remember it).
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Content-Security-Policy: scripts may only come from this site, Google Analytics, Google sign-in and
      # the Firebase login popup. Inline scripts are blocked, which is what stops injected scripts (XSS).
      # If you add a new outside service (a script, API or font host), add its address here or the browser blocks it.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com https://*.googleusercontent.com; media-src 'self'; connect-src 'self' blob: https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://analyticsdata.googleapis.com https://www.googleapis.com https://accounts.google.com https://api.github.com https://abacus.jasoncameron.dev; frame-src https://accounts.google.com https://*.firebaseapp.com https://*.web.app; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /auth/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /auth/*
        name: Cache-Control
        value: no-store
      - path: /admin
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /admin
        name: Cache-Control
        value: no-store
      - path: /admin/*
        name: Cache-Control
        value: no-store
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /data/*
        name: Cache-Control
        value: public, max-age=60
      - path: /pdfs/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
