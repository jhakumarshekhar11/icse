# Netlify settings. Branch to deploy is chosen in the Netlify dashboard (set it to "website").
[build]
  publish = "."

# icse.shekharjha.tech/ goes to the resource page
[[redirects]]
  from = "/"
  to = "/resource"
  status = 301

# /resource serves the library (deep links use /resource?file=...)
[[redirects]]
  from = "/resource"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/resource/"
  to = "/index.html"
  status = 200

# /admin serves the admin console
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
